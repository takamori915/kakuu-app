<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かきじゅんずかん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a school notebook page. Pale blue ruled paper, red-pencil accent,
   each kanji sits in a dashed-cross practice square like the real 漢字ノート. */
:root {
  --paper: #f5f9fd;
  --card: #ffffff;
  --grid: #dfeaf4;
  --line: #c9dbea;
  --ink: #1b2230;
  --ink-2: #566175;
  --accent: #0f7fc0;
  --accent-soft: #dff1fb;
  --ok: #26804f;
  --ok-soft: #e0f2e7;
  --guide: #b5d9ee;
  --shadow: 0 1px 0 rgba(27, 34, 48, .05), 0 6px 18px rgba(27, 34, 48, .06);
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-kanji: "Klee One", "Yu Kyokasho", "UD Digi Kyokasho N-R", "Hiragino Mincho ProN", "Noto Serif JP", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171e; --card: #1a212b; --grid: #1b2430; --line: #2b3646;
    --ink: #edf1f7; --ink-2: #9ba7b9; --accent: #5cc3f0; --accent-soft: #1c3442;
    --ok: #5ccb8a; --ok-soft: #1c3227; --guide: #2f5568;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171e; --card: #1a212b; --grid: #1b2430; --line: #2b3646;
  --ink: #edf1f7; --ink-2: #9ba7b9; --accent: #5cc3f0; --accent-soft: #1c3442;
  --ok: #5ccb8a; --ok-soft: #1c3227; --guide: #2f5568;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 56px; }

/* ---------- header + controls ---------- */
.top { padding: 28px 0 12px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: .02em; text-wrap: balance; }
h1 .mark { color: var(--accent); }
.lead { margin: 0; color: var(--ink-2); font-size: 14px; }

.controls {
  position: sticky; top: 0; z-index: 5;
  margin: 0 -16px; padding: 10px 16px 12px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
}
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tab {
  min-height: 48px; padding: 4px 2px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card);
  display: grid; justify-items: center; align-content: center; line-height: 1.2; font-size: 16px; font-weight: 700;
}
.tab small { font-size: 11px; font-weight: 400; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab[aria-selected="true"] small { color: var(--paper); opacity: .8; }
.search { position: relative; }
.search input {
  width: 100%; height: 52px; padding: 0 48px 0 48px;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--card); font-size: 18px;
}
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.search svg { position: absolute; left: 15px; top: 15px; width: 22px; height: 22px; color: var(--ink-2); pointer-events: none; }
.search .clear {
  position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-2); font-size: 22px; line-height: 1;
}
.search .clear[hidden] { display: none; }

.filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.frow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.frow[hidden] { display: none; }
.flabel { flex: none; width: 3.4em; font-size: 12px; color: var(--ink-2); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 4px; scrollbar-width: thin; min-width: 0; flex: 1; }
.chip {
  flex: none; min-width: 44px; height: 36px; padding: 0 14px;
  border: 1.5px solid var(--line); border-radius: 999px; background: var(--card);
  font-size: 15px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #08141c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #08141c; } }

.summary { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between; padding: 14px 0 10px; color: var(--ink-2); font-size: 14px; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
.sort { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.sort button { border: 0; background: transparent; padding: 5px 12px; font-size: 14px; }
.sort button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- cards ---------- */
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.card[data-status="done"] { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.open { border: 0; background: transparent; padding: 14px 12px 8px; display: grid; justify-items: center; gap: 8px; text-align: center; }
.square {
  position: relative; width: 112px; height: 112px; display: grid; place-items: center;
  border: 1.5px solid var(--guide); border-radius: 6px;
  background:
    linear-gradient(90deg, var(--guide) 50%, transparent 50%) center / 9px 1.5px repeat-x,
    linear-gradient(0deg, var(--guide) 50%, transparent 50%) center / 1.5px 9px repeat-y;
}
.square::after { content: ""; position: absolute; inset: 0; background: var(--card); opacity: 0; }
.kanji { position: relative; z-index: 1; font-family: var(--font-kanji); font-size: 84px; line-height: 1; font-weight: 600; text-shadow: 0 0 0 var(--card); }
.meta { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.tag.plain { background: transparent; border: 1px solid var(--line); color: var(--ink-2); font-weight: 500; }
.reads { font-size: 14px; color: var(--ink-2); line-height: 1.5; min-height: 3em; }
.reads b { color: var(--ink); font-weight: 700; }
.play { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-size: 13px; font-weight: 700; }
.play svg { width: 16px; height: 16px; }
.marks { display: grid; grid-template-columns: 1fr 1fr; border-top: 1.5px solid var(--line); }
.mark-btn { border: 0; background: transparent; padding: 9px 4px; font-size: 14px; color: var(--ink-2); min-height: 44px; }
.mark-btn + .mark-btn { border-left: 1.5px solid var(--line); }
.mark-btn[aria-pressed="true"].practice { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.mark-btn[aria-pressed="true"].done { background: var(--ok-soft); color: var(--ok); font-weight: 700; }

.empty { text-align: center; padding: 48px 12px; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.empty button { margin-top: 12px; height: 44px; padding: 0 20px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--card); color: var(--accent); font-weight: 700; }

.foot { margin-top: 28px; padding: 14px 16px; border: 1.5px dashed var(--line); border-radius: 14px; color: var(--ink-2); font-size: 13px; background: color-mix(in srgb, var(--card) 70%, transparent); }
.foot p { margin: 0; }
.foot p + p { margin-top: 4px; }

/* ---------- video dialog ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 14, 20, .62); display: grid; place-items: center; padding: 12px; }
.scrim[hidden] { display: none; }
.sheet { width: min(900px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--card); border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px 18px; }
.sheet-head h2 { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
.sheet-head h2 .k { font-family: var(--font-kanji); font-size: 30px; margin-right: 8px; color: var(--accent); }
.kanji.latin, .sheet-head h2 .k.latin { font-family: "Helvetica Neue", Arial, "Noto Sans", "Segoe UI", sans-serif; font-weight: 500; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 20px; line-height: 1; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.video-box { background: #fff; aspect-ratio: 16 / 9; width: 100%; }
.video-box video { width: 100%; height: 100%; display: block; background: #faf7f2; }
.sheet-body { padding: 12px 18px 18px; display: grid; gap: 10px; }
.speed { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.speed .chip { height: 40px; }
.facts { margin: 0; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; font-size: 15px; }
.facts dt { color: var(--ink-2); font-size: 13px; }
.facts dd { margin: 0; }
.facts dd.has-pic { display: flex; align-items: center; gap: 10px; }
.facts .pic { font-size: 40px; line-height: 1; flex: none; }
.facts .jp { display: block; font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.note { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 14px; }

@media (max-width: 420px) {
  h1 { font-size: 24px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .square { width: 96px; height: 96px; }
  .kanji { font-size: 72px; }
  .scrim { padding: 0; align-items: end; }
  .sheet { border-radius: 20px 20px 0 0; max-height: 96%; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: transform .12s ease, box-shadow .12s ease; }
  .card:hover { transform: translateY(-2px); }
}
</style>
<link rel="stylesheet" href="practice.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span class="mark">かきじゅん</span>ずかん</h1>
    <p class="lead">もじを おして、かきじゅんを みよう</p>
  </header>

  <section class="controls" aria-label="さがす・しぼりこみ">
    <div class="tabs" id="tabs" role="tablist" aria-label="もじの しゅるい"></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
             placeholder="さがす(れい: あめ)" aria-label="かんじ・よみ・ことばで さがす">
      <button class="clear" id="qclear" type="button" aria-label="もじを けす" hidden>×</button>
    </div>
    <div class="filters">
      <div class="frow"><span class="flabel">よみ</span><div class="chips" id="rows" role="group" aria-label="よみの ぎょうで しぼりこむ"></div></div>
      <div class="frow"><span class="flabel">かず</span><div class="chips" id="strokes" role="group" aria-label="かくの かずで しぼりこむ"></div></div>
      <div class="frow"><span class="flabel">しるし</span><div class="chips" id="status" role="group" aria-label="しるしでしぼりこむ"></div></div>
    </div>
  </section>

  <div class="summary">
    <span id="count" aria-live="polite"></span>
    <span class="sort" role="group" aria-label="ならびかえ">
      <button type="button" data-sort="kana" aria-pressed="true">あいうえお順</button>
      <button type="button" data-sort="strokes" aria-pressed="false">かずの じゅん</button>
    </span>
  </div>

  <ul class="grid" id="grid"></ul>
  <div class="empty" id="soon" hidden>
    <strong>このタブの どうがは、まだ ありません</strong>
    <span>じゅんびが できたら、ここに ならびます。</span>
  </div>
  <div class="empty" id="empty" hidden>
    <strong>みつかりません</strong>
    <span>ひらがなで「あめ」のように いれるか、しぼりこみを はずして ください。</span><br>
    <button type="button" id="reset">しぼりこみを ぜんぶ はずす</button>
  </div>

  <aside class="foot">
    <p>どうがは てづくりです。がっこうの みほんや せんせいの おしえかたと ちがうときは、がっこうの ほうを まもってね。</p>
    <p>「みた」「おぼえた」の しるしは、この ブラウザの なかにだけ のこります。</p>
  </aside>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle" id="sheet">
    <div class="sheet-head">
      <button class="icon-btn" id="prev" type="button" aria-label="まえの もじ">‹</button>
      <h2 id="dtitle"></h2>
      <button class="icon-btn" id="next" type="button" aria-label="つぎの もじ">›</button>
      <button class="icon-btn" id="close" type="button" aria-label="とじる">×</button>
    </div>
    <div class="video-box"><video id="video" controls playsinline muted loop preload="metadata"></video></div>
    <div class="sheet-body">
      <div class="speed" role="group" aria-label="どうがの はやさ">
        <button class="chip" type="button" data-rate="0.5" aria-pressed="false">ゆっくり</button>
        <button class="chip" type="button" data-rate="1" aria-pressed="true">ふつう</button>
      </div>
      <dl class="facts" id="facts"></dl>
      <p class="note" id="note" hidden></p>
    </div>
  </div>
</div>

<script>
/* ---- data: add one object per kanji; put its video in videos/ ---- */
const KANJI = [
  { k: "雨", on: ["ウ"], kun: ["あめ", "あま"], mean: "そらから ふって くる みず", ex: ["雨が ふって きた", "あめが ふって きた", "🌧️"], words: [["大雨", "おおあめ"], ["小雨", "こさめ"], ["雨天", "うてん"]],
    grade: 1, strokes: 8, video: "videos/ame.mp4", note: "" },
  { k: "字", on: ["ジ"], kun: [], mean: "ことばを かく ための しるし。もじ", ex: ["字を ゆっくり かく", "じを ゆっくり かく", "✏️"], words: [["文字", "もじ"], ["十字", "じゅうじ"], ["赤字", "あかじ"]],
    grade: 1, strokes: 6, video: "videos/ji.mp4", note: "" },
  { k: "水", on: ["スイ"], kun: ["みず"], mean: "のむ みず。かわや うみの みず", ex: ["水を のむ", "みずを のむ", "🚰"], words: [["水", "みず"], ["水玉", "みずたま"], ["水田", "すいでん"]],
    grade: 1, strokes: 4, video: "videos/sui.mp4", note: "" },
  { k: "大", on: ["ダイ", "タイ"], kun: ["おお", "おおきい"], mean: "おおきい こと", ex: ["大きい きを 見た", "おおきい きを みた", "🌳"], words: [["大きい", "おおきい"], ["大雨", "おおあめ"], ["大小", "だいしょう"]],
    grade: 1, strokes: 3, video: "videos/dai.mp4", note: "" },
  { k: "一", on: ["イチ", "イツ"], kun: ["ひと", "ひとつ"], mean: "ひとつ。かずの 1", ex: ["一つ ください", "ひとつ ください", "☝️"], words: [["一つ", "ひとつ"], ["一人", "ひとり"], ["一年", "いちねん"]],
    grade: 1, strokes: 1, video: "videos/ichi.mp4", note: "" },
  { k: "二", on: ["ニ"], kun: ["ふた", "ふたつ"], mean: "ふたつ。かずの 2", ex: ["二つ たべた", "ふたつ たべた", "✌️"], words: [["二つ", "ふたつ"], ["二人", "ふたり"], ["二日", "ふつか"]],
    grade: 1, strokes: 2, video: "videos/ni.mp4", note: "" },
  { k: "三", on: ["サン"], kun: ["み", "みっつ"], mean: "みっつ。かずの 3", ex: ["三つ ならべる", "みっつ ならべる", "🍡"], words: [["三つ", "みっつ"], ["三日", "みっか"], ["三月", "さんがつ"]],
    grade: 1, strokes: 3, video: "videos/san.mp4", note: "" },
  { k: "十", on: ["ジュウ", "ジッ"], kun: ["とお", "と"], mean: "とお。かずの 10", ex: ["十まで かぞえる", "とおまで かぞえる", "🔟"], words: [["十", "とお"], ["十人", "じゅうにん"], ["十日", "とおか"]],
    grade: 1, strokes: 2, video: "videos/juu.mp4", note: "" },
  { k: "八", on: ["ハチ"], kun: ["や", "やっつ"], mean: "やっつ。かずの 8", ex: ["おかしが 八つ ある", "おかしが やっつ ある", "🍬"], words: [["八つ", "やっつ"], ["八百", "はっぴゃく"], ["八日", "ようか"]],
    grade: 1, strokes: 2, video: "videos/hachi.mp4", note: "" },
  { k: "力", on: ["リョク", "リキ"], kun: ["ちから"], mean: "からだの ちから。ちからが つよい こと", ex: ["力を 入れて もつ", "ちからを いれて もつ", "💪"], words: [["力", "ちから"], ["力もち", "ちからもち"], ["学力", "がくりょく"]],
    grade: 1, strokes: 2, video: "videos/chikara.mp4", note: "" },
  { k: "人", on: ["ジン", "ニン"], kun: ["ひと"], mean: "ひと。にんげん", ex: ["人が たくさん いる", "ひとが たくさん いる", "👥"], words: [["人", "ひと"], ["大人", "おとな"], ["人口", "じんこう"]],
    grade: 1, strokes: 2, video: "videos/hito.mp4", note: "" },
  { k: "入", on: ["ニュウ"], kun: ["い", "はい"], mean: "そとから なかへ はいる こと", ex: ["へやに 入る", "へやに はいる", "🚪"], words: [["入る", "はいる"], ["入口", "いりぐち"], ["入学", "にゅうがく"]],
    grade: 1, strokes: 2, video: "videos/nyuu.mp4", note: "" },
  { k: "小", on: ["ショウ"], kun: ["ちい", "こ", "お"], mean: "ちいさい こと", ex: ["小さい 字を かく", "ちいさい じを かく", "🔍"], words: [["小さい", "ちいさい"], ["小雨", "こさめ"], ["小学校", "しょうがっこう"]],
    grade: 1, strokes: 3, video: "videos/shou.mp4", note: "" }

  document.dispatchEvent(new CustomEvent("kakuu:show", { detail: { d } }));
}
function openDialog(k, from) { openFrom = from || null; $("scrim").hidden = false; show(k); $("close").focus(); }
function closeDialog() { document.dispatchEvent(new CustomEvent("kakuu:close")); const v = $("video"); v.pause(); v.removeAttribute("src"); v.load(); $("scrim").hidden = true; if (marksChanged) { marksChanged = false; update(); } if (openFrom && document.contains(openFrom)) openFrom.focus(); }
function step(n) { const i = currentList.findIndex((x) => x.k === openKey); const t = currentList[i + n]; if (t) show(t.k); }
$("close").addEventListener("click", closeDialog);
$("prev").addEventListener("click", () => step(-1));
$("next").addEventListener("click", () => step(1));
$("scrim").addEventListener("click", (e) => { if (e.target === $("scrim")) closeDialog(); });
document.querySelector(".speed").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-rate]"); if (!b) return;
  document.querySelectorAll(".speed .chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
  $("video").playbackRate = Number(b.dataset.rate);
});
document.addEventListener("keydown", (e) => {
  if ($("scrim").hidden) return;
  if (e.key === "Escape") closeDialog();
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "Tab") {
    const f = [...$("sheet").querySelectorAll("button:not(:disabled), video")].filter((el) => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

update();
</script>
